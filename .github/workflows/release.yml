# Publishes a release when CHANGELOG.md gets a new version on main (or when run by hand): the web app (zip), the desktop
# apps (Linux AppImage, deb, rpm; Windows installer) with latest-linux.yml / latest.yml and the block maps (read by the
# desktop app's updater), the signed Android APK with android-latest.json (read by the Android app's updater), and
# SHA256SUMS for every file. The version is the top `## [x.y.z]` heading in CHANGELOG.md; a version
# whose tag already exists is skipped, so other edits to CHANGELOG.md (e.g. the Unreleased section) publish nothing.
name: Release
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:
    inputs:
      rebuild:
        description: Build again for the current version even if its release exists
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: v
        env: { REBUILD: "${{ inputs.rebuild }}" }
        run: |
          V=$(grep -m1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md || true)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ -z "$V" ]; then echo "No released version in CHANGELOG.md yet: nothing to publish."; echo "publish=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse "v$V" >/dev/null 2>&1 && [ "$REBUILD" != "true" ]; then echo "v$V exists: nothing to publish."; echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            # the notes are the release text: stop before building anything when the section is empty
            node scripts/release-notes.mjs "$V" | grep -q '[[:alnum:]]' || { echo "::error::CHANGELOG.md has no notes for $V"; exit 1; }
            echo "Publishing $V."; echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
  test:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @calc/core test
      - run: pnpm --filter @calc/core exec vitest run --dir ../../apps/web/test
  # Builds the web app once, with the release's version; the desktop and Android apps carry this same build.
  web:
    needs: [version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # the web app shows the root package.json version (Settings); keep it equal to CHANGELOG.md's even if bump was skipped
      - run: npm pkg set version=${{ needs.version.outputs.version }}
      - run: pnpm --filter @calc/web exec vite build
      - uses: actions/upload-artifact@v4
        with: { name: web, path: apps/web/dist, if-no-files-found: error }
      - name: Zip the web app (to host it yourself)
        working-directory: apps/web/dist
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          zip -qr "$GITHUB_WORKSPACE/out/calculator-${{ needs.version.outputs.version }}-web.zip" .
      - uses: actions/upload-artifact@v4
        with: { name: out-web, path: out/*, if-no-files-found: error }
  desktop:
    needs: [version, web]
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: --linux, files: "release/*.AppImage release/*.deb release/*.rpm", feed: release/latest-linux.yml }
          - { os: windows-latest, target: --win, files: "release/*-setup.exe", feed: release/latest.yml }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: web, path: apps/web/dist }
      - name: Tools for the rpm package
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build the installers
        working-directory: apps/desktop
        shell: bash
        run: |
          npm pkg set version=${{ needs.version.outputs.version }}
          node build.mjs
          npx electron-builder ${{ matrix.target }} --publish never
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp ${{ matrix.files }} "$GITHUB_WORKSPACE/out/"
          # the in-app updater's feed (electron-updater reads latest.yml / latest-linux.yml from the release: version,
          # file name, SHA-512) and the block maps for smaller downloads; electron-builder writes them because of the
          # "publish" setting in apps/desktop/package.json, even with --publish never
          [ -f "${{ matrix.feed }}" ] || { echo "::error::${{ matrix.feed }} was not made (is build.publish still set?)"; exit 1; }
          cp "${{ matrix.feed }}" "$GITHUB_WORKSPACE/out/"
          shopt -s nullglob
          for f in release/*.blockmap; do cp "$f" "$GITHUB_WORKSPACE/out/"; done
      - uses: actions/upload-artifact@v4
        with: { name: "out-desktop-${{ runner.os }}", path: out/*, if-no-files-found: error }
  android:
    needs: [version, web]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: web, path: apps/web/dist }
      - name: Copy the app into the Android project
        working-directory: apps/android
        run: node prepare-web.mjs && npx cap sync android
      # Every version must be signed with the same key (or phones refuse the update), so a missing key stops the release
      # instead of publishing an unsigned or differently signed APK.
      - name: Build the signed APK
        working-directory: apps/android/android
        env:
          CALC_KEYSTORE_B64: ${{ secrets.CALC_KEYSTORE }}
          CALC_KEYSTORE_PASSWORD: ${{ secrets.CALC_KEYSTORE_PASSWORD }}
          CALC_KEY_ALIAS: ${{ secrets.CALC_KEY_ALIAS }}
          CALC_KEY_PASSWORD: ${{ secrets.CALC_KEY_PASSWORD }}
        run: |
          if [ -z "$CALC_KEYSTORE_B64" ] || [ -z "$CALC_KEYSTORE_PASSWORD" ]; then
            echo "::error::The Android signing key is missing: add the CALC_KEYSTORE and CALC_KEYSTORE_PASSWORD repository secrets (docs/apps.md, Releases)."
            exit 1
          fi
          printf '%s' "$CALC_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/calculator.jks"
          export CALC_KEYSTORE="$RUNNER_TEMP/calculator.jks"
          # empty optional secrets fall back to the defaults in build.gradle (alias "calculator", key password = store password)
          [ -n "$CALC_KEY_ALIAS" ] || unset CALC_KEY_ALIAS
          [ -n "$CALC_KEY_PASSWORD" ] || unset CALC_KEY_PASSWORD
          chmod +x gradlew
          ./gradlew assembleRelease -PappVersion=${{ needs.version.outputs.version }}
          rm -f "$CALC_KEYSTORE"
          APK=app/build/outputs/apk/release/app-release.apk
          [ -f "$APK" ] || { echo "::error::No signed APK was made (only an unsigned one?)"; exit 1; }
          "$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 | sort -V | tail -n1)/apksigner" verify "$APK"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$APK" "$GITHUB_WORKSPACE/out/calculator-${{ needs.version.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: out-android, path: out/*, if-no-files-found: error }
  # Publishes only when every build succeeded, so a release never lacks a file.
  publish:
    needs: [version, web, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: out-*, path: out, merge-multiple: true }
      - name: Update manifest and checksums
        working-directory: out
        run: |
          V=${{ needs.version.outputs.version }}
          APK=calculator-$V.apk
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          URL=https://github.com/${{ github.repository }}/releases/download/v$V/$APK
          printf '{"version":"%s","url":"%s","sha256":"%s","size":%s}\n' "$V" "$URL" "$SHA" "$(stat -c%s "$APK")" > android-latest.json
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V=${{ needs.version.outputs.version }}
          node scripts/release-notes.mjs "$V" > notes.md
          grep -q '[[:alnum:]]' notes.md || { echo "::error::CHANGELOG.md has no notes for $V"; exit 1; }
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" out/* --clobber
          else
            gh release create "v$V" --target "${{ github.sha }}" --title "Calculator $V" --notes-file notes.md out/*
          fi
  # The hosted copy at https://userofit123.github.io/calculator/ (GitHub Pages, source "GitHub Actions"): the same web
  # app built for the /calculator/ sub-path (CALC_BASE, see apps/web/vite.config.ts). Once opened it keeps itself on the
  # device like any copy, so it works offline from then on. 404.html is the page again, so a deep link such as
  # /calculator/converter opens the app on a first visit too (Pages answers unknown paths with 404.html).
  pages:
    # after publish, so the hosted copy never runs ahead of a release that failed to build
    needs: [version, test, publish]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npm pkg set version=${{ needs.version.outputs.version }}
      - run: pnpm --filter @calc/web exec vite build
        env: { CALC_BASE: /calculator/ }
      - run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/web/dist }
      - id: deploy
        uses: actions/deploy-pages@v4
