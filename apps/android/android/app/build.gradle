apply plugin: 'com.android.application'

android {
    namespace "io.github.userofit123.calculator"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.userofit123.calculator"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // the release build passes -PappVersion=1.2.3 (from the release tag) → versionCode 10203
        def appVersion = project.findProperty("appVersion") ?: "0.1.0"
        // x.y.z with minor and patch under 100, or versionCode would collide with another version's
        if (!(appVersion ==~ /^\d+\.\d{1,2}\.\d{1,2}$/))
            throw new GradleException("appVersion must look like 1.2.3 (minor and patch 0-99), got '${appVersion}'")
        def parts = appVersion.tokenize(".").collect { it.toInteger() }
        versionCode parts[0] * 10000 + parts[1] * 100 + parts[2]
        versionName appVersion
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // The keystore lives outside the repo (a CI secret or a path on the build computer) and is never committed;
            // the same key must sign every version. Without it the release APK is unsigned; the debug build needs nothing.
            if (System.getenv("CALC_KEYSTORE")) {
                storeFile file(System.getenv("CALC_KEYSTORE"))
                storePassword System.getenv("CALC_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CALC_KEY_ALIAS") ?: "calculator"
                keyPassword System.getenv("CALC_KEY_PASSWORD") ?: System.getenv("CALC_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv("CALC_KEYSTORE")) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
